# Do not set shareProcessNamespace: true. PID 1 would become the pause
# container, which reaps orphans and hides the zombies in the plain Pod.
apiVersion: v1
kind: Pod
metadata:
  name: zombie-demo-plain
spec:
  containers:
    - name: app
      image: ghcr.io/beeeeemo/zombie-demo:plain
      imagePullPolicy: Always
      env:
        - name: ZOMBIE_LIMIT
          value: "30"
---
apiVersion: v1
kind: Pod
metadata:
  name: zombie-demo-tini
spec:
  containers:
    - name: app
      image: ghcr.io/beeeeemo/zombie-demo:tini
      imagePullPolicy: Always
      env:
        - name: ZOMBIE_LIMIT
          value: "30"
