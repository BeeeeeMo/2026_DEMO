name: Build DEMO2 images

on:
  push:
    branches: [main]
    paths:
      - "Demo_2/**"
      - ".github/workflows/build-demo2-images.yml"
  pull_request:
    paths:
      - "Demo_2/**"
      - ".github/workflows/build-demo2-images.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build native images and exercise application and diagnostics
        run: |
          docker build -t demo2-app:smoke -f Demo_2/Dockerfile Demo_2
          docker build -t demo2-debug:smoke -f Demo_2/Dockerfile.debug Demo_2
          python3 Demo_2/smoke.py

  build:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: threadpool-demo
            dockerfile: Dockerfile
          - image: threadpool-demo-debug
            dockerfile: Dockerfile.debug
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image (publish on push or manual run)
        uses: docker/build-push-action@v6
        with:
          context: ./Demo_2
          file: ./Demo_2/${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=demo2-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=demo2-${{ matrix.image }}
